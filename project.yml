name: MenuBarTodo
options:
  bundleIdPrefix: com.ruzgar
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: HK34NNSZ5W
    CODE_SIGN_STYLE: Automatic
packages:
  TodoCore:
    path: TodoCore
targets:
  MenuBarTodo:
    type: application
    platform: macOS
    sources: [MenuBarTodo, Shared]
    dependencies:
      - package: TodoCore
    info:
      path: MenuBarTodo/Info.plist
      properties:
        CFBundleName: ishler
        CFBundleDisplayName: ishler
        LSUIElement: true
        NSHumanReadableCopyright: ""
        NSCalendarsFullAccessUsageDescription: Takvimindeki etkinlikleri işlerinin yanında göstermek için.
    entitlements:
      path: MenuBarTodo/MenuBarTodo.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [group.com.ruzgar.ishler]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.ruzgar.ishler]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruzgar.ishler
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
  MenuBarTodoPhone:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources: [MenuBarTodoPhone, Shared]
    dependencies:
      - package: TodoCore
    info:
      path: MenuBarTodoPhone/Info.plist
      properties:
        CFBundleName: ishler
        CFBundleDisplayName: ishler
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSCalendarsFullAccessUsageDescription: Takvimindeki etkinlikleri işlerinin yanında göstermek için.
    entitlements:
      path: MenuBarTodoPhone/MenuBarTodoPhone.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ruzgar.ishler]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.ruzgar.ishler]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruzgar.ishler
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  MenuBarTodoTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MenuBarTodoTests]
    dependencies:
      - target: MenuBarTodo
      - package: TodoCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MenuBarTodo:
    build:
      targets:
        MenuBarTodo: all
    test:
      targets: [MenuBarTodoTests]
