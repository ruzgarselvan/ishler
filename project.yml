name: MenuBarTodo
options:
  bundleIdPrefix: com.ruzgar
  deploymentTarget:
    macOS: "26.0"
packages:
  TodoCore:
    path: TodoCore
targets:
  MenuBarTodo:
    type: application
    platform: macOS
    sources: [MenuBarTodo, Shared]
    dependencies:
      - package: TodoCore
    info:
      path: MenuBarTodo/Info.plist
      properties:
        CFBundleName: Menü Bar İşler
        LSUIElement: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruzgar.menubartodo
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
  MenuBarTodoPhone:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources: [MenuBarTodoPhone, Shared]
    dependencies:
      - package: TodoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruzgar.menubartodo.phone
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: İşler
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  MenuBarTodoTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MenuBarTodoTests]
    dependencies:
      - target: MenuBarTodo
      - package: TodoCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MenuBarTodo:
    build:
      targets:
        MenuBarTodo: all
    test:
      targets: [MenuBarTodoTests]
