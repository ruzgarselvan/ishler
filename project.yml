name: MenuBarTodo
options:
  bundleIdPrefix: com.ruzgar
  developmentLanguage: en
  knownRegions: [en, tr]
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: HK34NNSZ5W
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
packages:
  TodoCore:
    path: TodoCore
targets:
  MenuBarTodo:
    type: application
    platform: macOS
    sources: [MenuBarTodo, Shared]
    dependencies:
      - package: TodoCore
      - target: IshlerWidgetMac
    info:
      path: MenuBarTodo/Info.plist
      properties:
        CFBundleName: ishler
        CFBundleDisplayName: ishler
        CFBundleLocalizations: [en, tr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHumanReadableCopyright: ""
        NSCalendarsFullAccessUsageDescription: ishler shows your calendar events next to your tasks and adds due dates to your calendar.
    entitlements:
      path: MenuBarTodo/MenuBarTodo.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [HK34NNSZ5W.com.ruzgar.ishler]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.ruzgar.ishler]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruzgar.ishler
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
  MenuBarTodoPhone:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources: [MenuBarTodoPhone, Shared]
    dependencies:
      - package: TodoCore
      - target: IshlerWidget
    info:
      path: MenuBarTodoPhone/Info.plist
      properties:
        CFBundleName: ishler
        CFBundleDisplayName: ishler
        CFBundleLocalizations: [en, tr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSCalendarsFullAccessUsageDescription: ishler shows your calendar events next to your tasks and adds due dates to your calendar.
    entitlements:
      path: MenuBarTodoPhone/MenuBarTodoPhone.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ruzgar.ishler]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.ruzgar.ishler]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruzgar.ishler
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  IshlerWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: IshlerWidget
        excludes: ["Info-*.plist", "*.entitlements"]
      - Shared/Localizable.xcstrings
    dependencies:
      - package: TodoCore
    info:
      path: IshlerWidget/Info-iOS.plist
      properties:
        CFBundleName: ishler
        CFBundleDisplayName: ishler
        CFBundleLocalizations: [en, tr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: IshlerWidget/IshlerWidget-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ruzgar.ishler]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruzgar.ishler.widget
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  IshlerWidgetMac:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: IshlerWidget
        excludes: ["Info-*.plist", "*.entitlements"]
      - Shared/Localizable.xcstrings
    dependencies:
      - package: TodoCore
    info:
      path: IshlerWidget/Info-macOS.plist
      properties:
        CFBundleName: ishler
        CFBundleDisplayName: ishler
        CFBundleLocalizations: [en, tr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: IshlerWidget/IshlerWidget-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [HK34NNSZ5W.com.ruzgar.ishler]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruzgar.ishler.widget
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  MenuBarTodoTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MenuBarTodoTests]
    dependencies:
      - target: MenuBarTodo
      - package: TodoCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MenuBarTodo:
    build:
      targets:
        MenuBarTodo: all
    test:
      targets: [MenuBarTodoTests]
